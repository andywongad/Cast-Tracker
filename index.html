<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F4F4F3" />
    <title>Cast Tracker</title>
    <meta name="description" content="Keep track of who's who — cast, characters, and relationships across the shows you watch." />

    <!-- The one address this app lives at, whatever address you arrived by.

         vercel.json already redirects cast-tracker-m8g3.vercel.app here, but that rule names one
         host and Vercel gives every deployment a URL of its own — cast-tracker-git-main-….vercel.app
         and one per preview. Those serve the identical app and are perfectly indexable, so without
         this the real site would be competing in search results against copies of itself. A
         canonical is the only fix that covers hosts nobody has thought of yet. -->
    <link rel="canonical" href="https://casttracker.app/" />

    <!-- How this page looks when someone pastes the link.

         Static tags rather than a head manager, because there is nothing to vary: no router, no
         second route, and screens are swapped by state in App.tsx. Every visitor arrives at "/"
         and that is the only URL a scraper can ever see, so per-page overrides would be machinery
         with nothing to manage. The day this grows real routes, react-helmet-async goes here and
         these become the defaults it falls back to.

         Title and description are the same words as the <title> and <meta name="description">
         above, on purpose: the preview card and the search result should not disagree about what
         this is.

         The image URLs are absolute, which is a small deviation from "/og-image.png" and a
         deliberate one — relative og:image is resolved inconsistently across scrapers and is
         simply dropped by some, which shows as a card with no picture rather than an error.
         /og-image.png does not exist yet, so previews will render text-only until it does. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://casttracker.app/" />
    <meta property="og:title" content="Cast Tracker" />
    <meta property="og:description" content="Keep track of who's who — cast, characters, and relationships across the shows you watch." />
    <meta property="og:image" content="https://casttracker.app/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cast Tracker" />
    <meta name="twitter:description" content="Keep track of who's who — cast, characters, and relationships across the shows you watch." />
    <meta name="twitter:image" content="https://casttracker.app/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cast Tracker" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
